<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>XScroll · Écran</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/screen.css">
  <script src="/screen-boot.js" defer></script>
  <script src="/screen.js" type="module"></script>
</head>
<body data-page-title="XScroll · Écran">
  <main id="lobby" aria-labelledby="lobby-title">
    <div class="lobby-card">
      <div class="lobby-header">
        <div class="brand"><img src="/icon.png" width="41" height="41" alt="">XScroll</div>
        <select class="language-select" aria-label="Langue"><option value="en">English</option><option value="fr">Français</option></select>
      </div>
      <h1 id="lobby-title">Connecter cet écran</h1>
      <p id="lobby-help">Ouvre <strong>Écran externe</strong> dans la télécommande sur ton téléphone, puis saisis ce code.</p>
      <output id="screen-code" aria-label="Code de l’écran"></output>
      <p id="lobby-status" role="status">Chargement du code…</p>
      <button type="button" id="new-code" hidden>Nouveau code</button>
    </div>
  </main>

  <main id="viewer" aria-label="Lecteur sur écran externe" hidden>
    <video id="display-video" playsinline muted loop preload="auto"></video>
    <p id="subtitle" hidden></p>
    <div class="wait" id="wait" role="status" hidden></div>
    <div class="overlay">
      <article id="caption" class="post-card" aria-label="Publication X" hidden>
        <div class="caption-head">
          <div class="caption-avatar" aria-hidden="true"><span id="avatar-letter">X</span><img id="author-avatar" alt="" hidden></div>
          <div class="caption-identity"><strong id="author-name"></strong><p id="author"></p></div>
        </div>
        <p id="text"></p>
      </article>
      <article id="screen-comment" aria-label="Commentaire" hidden>
        <div class="screen-comment-head">
          <div class="screen-comment-avatar" aria-hidden="true"><span id="comment-letter">X</span><img id="comment-avatar" alt="" hidden></div>
          <div class="screen-comment-identity">
            <strong id="comment-name"></strong>
            <span id="comment-handle"></span>
          </div>
          <time id="comment-time" hidden></time>
        </div>
        <p id="comment-text"></p>
        <div id="comment-stats" hidden>
          <span data-comment-stat="likeCount">Likes: <b></b></span>
          <span data-comment-stat="repostCount">Reposts: <b></b></span>
          <span data-comment-stat="bookmarkCount">Bookmarks: <b></b></span>
        </div>
      </article>
      <div class="tools">
        <select class="language-select" aria-label="Langue"><option value="en">English</option><option value="fr">Français</option></select>
        <button type="button" id="screen-audio" aria-pressed="false">Activer le son</button>
        <button type="button" id="fullscreen">Plein écran</button>
      </div>
    </div>
  </main>
</body>
</html>
